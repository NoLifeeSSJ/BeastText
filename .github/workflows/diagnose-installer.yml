name: Diagnose Windows installer
on:
  push:
    paths: [.github/workflows/diagnose-installer.yml]
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BeastText-Windows-x64
          run-id: 39874645140
          github-token: ${{ github.token }}
          path: .
      - name: Run installer checks with diagnostic annotations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/verify-windows.ps1
            if ($LASTEXITCODE -ne 0) { throw "Installer verification exited $LASTEXITCODE" }
          } catch {
            $message = ($_ | Out-String) + $_.ScriptStackTrace
            $escaped = $message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error::$escaped"
            Get-ChildItem -Path $env:TEMP -Filter 'BeastText-install-*.log' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 2 |
              ForEach-Object {
                $detail = Get-Content -LiteralPath $_.FullName -Raw
                $detail = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                Write-Host "::error::Installer log: $detail"
              }
            throw
          }
