name: Verify and release BeastText
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec install-electron -- --no
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm run package:win
      - name: Install, reinstall, shortcut and uninstall checks
        shell: pwsh
        run: ./scripts/verify-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BeastText-Windows-x64
          path: |
            release/*.zip
            release/release.json
            release/*BeastText.ps1
            test-results/*.pdf
            test-results/*.png
      - name: Publish tagged Windows prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
          gh release create $env:GITHUB_REF_NAME `
            "release/BeastText-$version-win-x64.zip" `
            release/release.json `
            release/Install-BeastText.ps1 `
            release/Uninstall-BeastText.ps1 `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title "BeastText $version" `
            --notes-file docs/RELEASE_NOTES.md `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
